<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SpeakDeck · 卡片式英语口语工作台</title>
  <meta name="description" content="卡片式英语口语学习工作台">
  <meta name="theme-color" content="#3b7df6">
  <!-- 禁止浏览器发送 Referer，避免 file:// 打开时百度/有道等 TTS 接口因 Referer 异常而返回空 -->
  <meta name="referrer" content="no-referrer">
  
  <style>/* ============================================================
 *  SpeakDeck · 样式表（已统一为工作台浅色清爽风格）
 * ============================================================ */
:root {
  --bg: #f4f6fa;
  --bg-soft: #f3f6fc;
  --card: #ffffff;
  --ink: #1f2733;
  --ink-soft: #6b7280;
  --line: #e6e9ef;
  --brand: #3b7df6;
  --brand-soft: #eef4ff;
  --accent: #ff8a65;
  --kw: #ff7a59;
  --kw-bg: #fff0ea;
  --good: #34c759;
  --good-soft: #e8f9ee;
  --warn: #ff9500;
  --warn-soft: #fff4e5;
  --bad: #ff3b30;
  --bad-soft: #ffebee;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 4px 12px rgba(16, 24, 40, 0.05);
  --radius: 14px;
  font-size: 16px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0 0 .4em; font-weight: 800; letter-spacing: .2px; }
p { margin: .3em 0; }

/* ---------- 顶部栏 ---------- */
.audio-banner {
  display: flex; align-items: center; justify-content: center;
  padding: 8px 16px; font-size: 13px; font-weight: 600;
  background: #fff8e1; color: #b9801e; gap: 6px; flex-wrap: wrap;
}
.audio-banner.good { background: #e8f5e9; color: #2e7d32; }
.audio-banner[hidden] { display: none; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 14px 20px;
  background: #ffffff;
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 30;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand .logo { font-size: 30px; }
.brand h1 { font-size: 22px; }
.tagline { font-size: 12px; color: var(--ink-soft); margin: 0; }
.topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.streak {
  background: var(--warn-soft); color: #c9701a; font-weight: 700;
  padding: 6px 12px; border-radius: 999px; font-size: 14px;
}

/* ---------- 移动端底部导航 ---------- */
.mobnav {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0;
  background: #fff; border-top: 1px solid var(--line);
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
  z-index: 40; box-shadow: 0 -2px 12px rgba(40,60,120,.06);
}
.mobitem {
  flex: 1; border: none; background: transparent; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 4px 0; font-size: 10px; color: var(--ink-soft); font-weight: 700;
  transition: color .15s;
}
.mobitem .mobicn { font-size: 20px; line-height: 1; }
.mobitem.active { color: var(--brand); background: var(--brand-soft); }

/* ---------- 按钮 ---------- */
.btn {
  border: none; cursor: pointer; border-radius: 999px;
  padding: 9px 16px; font-size: 14px; font-weight: 700;
  background: var(--brand-soft); color: var(--brand);
  transition: transform .08s ease, box-shadow .15s ease, background .15s;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn:active { transform: translateY(0); }
.btn.primary { background: #fff; color: var(--brand); border: 1px solid var(--brand); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); }
.btn.small { padding: 7px 12px; font-size: 13px; }
.btn.block { width: 100%; margin-top: 10px; }

/* ---------- 日进度 ---------- */
.daily-progress { padding: 10px 20px; background: var(--bg-soft); }
.dp-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-soft); margin-bottom: 5px; }
.dp-bar { height: 8px; background: #e3e8f2; border-radius: 999px; overflow: hidden; }
.dp-fill { height: 100%; width: 0%; background: linear-gradient(90deg,#3b7df6,#7aa2ff); transition: width .4s ease; }

/* ---------- 导航 ---------- */
.mainnav {
  display: flex; gap: 8px; padding: 12px 20px; overflow-x: auto;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.navitem {
  border: none; background: transparent; cursor: pointer;
  padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 700;
  color: var(--ink-soft); white-space: nowrap; transition: all .15s;
}
.navitem:hover { background: var(--bg-soft); }
.navitem.active { background: var(--brand-soft); color: var(--brand); }

/* ---------- 筛选 ---------- */
.filters {
  display: flex; flex-direction: column; gap: 10px;
  padding: 12px 20px; background: var(--bg);
}
.filter-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filter-collapse {
  display: none; flex-wrap: wrap; gap: 10px; align-items: center;
  animation: slideDown .2s ease;
}
.filter-collapse.open { display: flex; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
.filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: #fff; cursor: pointer;
  padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  color: var(--ink-soft); transition: all .15s; display: inline-flex; align-items: center; gap: 4px;
}
.chip:hover { border-color: var(--brand); color: var(--brand); }
.chip.active { background: var(--brand-soft); border-color: var(--brand-soft); color: var(--brand); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.filter-search { flex: 1; min-width: 180px; }
.filter-search input {
  width: 100%; padding: 9px 14px; border: 1px solid var(--line);
  border-radius: 999px; font-size: 14px; outline: none; background: #fff;
}
.filter-search input:focus { border-color: var(--brand); }

/* ---------- 内容区 ---------- */
.content { padding: 18px 20px 80px; max-width: 1180px; margin: 0 auto; }
.section-title { font-size: 17px; margin: 6px 0 14px; }
.muted { color: var(--ink-soft); font-size: 14px; }

/* ---------- 卡片 ---------- */
.card-grid {
  display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
}
.fcard {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px; display: flex; flex-direction: column; gap: 12px;
  border: 1px solid var(--line); position: relative; transition: transform .12s ease;
  overflow: hidden;
}
.fcard:hover { transform: translateY(-2px); }
.fcard .new-badge {
  position: absolute; top: 0; right: 0;
  background: var(--brand); color: #fff; font-size: 11px; font-weight: 800;
  padding: 4px 10px; border-radius: 0 0 0 10px; z-index: 2;
}
.fcard .badges { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft); }
.fcard .badges .lvl { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; color: #fff; }
.scene-tag { display: inline-flex; align-items: center; gap: 4px; }
.star {
  margin-left: auto; background: none; border: none; cursor: pointer; font-size: 20px;
  color: #d7dbe6; line-height: 1; transition: transform .15s, color .15s;
}
.star:hover { transform: scale(1.2); }
.star.on { color: #ffc107; }

.sentence { font-size: 22px; font-weight: 700; line-height: 1.45; letter-spacing: .2px; }
.sentence-translation { font-size: 14px; color: var(--ink-soft); line-height: 1.5; }
.dialogue { background: var(--bg-soft); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; }
.dialogue .line { padding: 4px 0; }
.dialogue .who { color: var(--brand); margin-right: 6px; }
.line-translation { font-size: 12px; color: var(--ink-soft); margin-top: 2px; padding-left: 26px; }
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.card-actions .btn { font-size: 13px; padding: 7px 12px; }
.dialogue .line { display: flex; gap: 8px; padding: 3px 0; }
.dialogue .who {
  font-weight: 800; font-size: 12px; min-width: 20px; color: var(--brand);
}
.dialogue-actions { display: flex; gap: 8px; align-items: center; margin-top: 6px; }

/* 重点词 */
.kw {
  color: var(--kw); background: var(--kw-bg); border-radius: 7px;
  padding: 1px 6px; cursor: pointer; font-weight: 700; position: relative;
  border-bottom: 2px solid var(--kw);
}
.kw:hover { background: #ffe2d8; }
.kw .ipa { font-size: 11px; color: #b3563c; font-weight: 600; margin-left: 4px; font-style: italic; }
.speak-btn {
  border: none; background: var(--kw); color: #fff; cursor: pointer;
  width: 20px; height: 20px; border-radius: 50%; font-size: 10px;
  margin-left: 3px; padding: 0; vertical-align: middle; line-height: 1;
  transition: transform .1s ease, box-shadow .15s ease;
}
.speak-btn:hover { background: #ff6a44; }
.speak-btn:active, .speak-btn.speaking {
  transform: scale(1.25); box-shadow: 0 0 10px rgba(255,122,89,.5);
  background: #ff5722;
}

.culture {
  background: #fff8ec; border-left: 4px solid var(--warn);
  border-radius: 8px; padding: 9px 12px; font-size: 13px; color: #7a5a1e;
}
.culture b { color: #b9801e; }

.card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.card-actions .btn { font-size: 13px; }

/* 空状态 */
.empty {
  text-align: center; padding: 60px 20px; color: var(--ink-soft);
}
.empty .emoji { font-size: 46px; }

/* ---------- 弹窗 ---------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(20,30,60,.45);
  display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px;
}
.modal-overlay[hidden] { display: none; }
.modal {
  background: #fff; border-radius: 18px; padding: 22px; width: 100%;
  max-width: 560px; max-height: 86vh; overflow-y: auto; position: relative;
  box-shadow: 0 20px 60px rgba(20,30,60,.25); animation: pop .18s ease;
}
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-close {
  position: absolute; top: 14px; right: 14px; border: none; background: var(--bg-soft);
  width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 15px; color: var(--ink-soft);
}
.modal-close:hover { background: #e2e7f1; }

/* 词详情面板 */
.word-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.word-head .w { font-size: 28px; font-weight: 800; color: var(--kw); }
.word-head .ipa { font-size: 16px; color: #b3563c; font-style: italic; }
.word-head .pos { font-size: 13px; color: #fff; background: var(--brand); padding: 2px 9px; border-radius: 999px; }
.word-row { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.word-row .k { min-width: 64px; color: var(--ink-soft); font-weight: 700; }
.word-row .v { flex: 1; }
.word-ex { background: var(--bg-soft); border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 14px; }
.word-ex li { margin: 4px 0; }
.word-speak { margin-top: 12px; }

/* 语法面板 */
.grammar-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
.grammar-tabs .chip.active { background: var(--brand); color: #fff; }
.gtable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.gtable th, .gtable td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; }
.gtable th { background: var(--bg-soft); }
.gtable tr:nth-child(even) td { background: #fafbff; }
.gnote { font-size: 13px; color: var(--ink-soft); margin-top: 8px; }

/* AI 陪练 */
.ai-scene { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.ai-chat { background: var(--bg-soft); border-radius: 12px; padding: 12px; height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.bubble { max-width: 80%; padding: 9px 13px; border-radius: 14px; font-size: 14px; }
.bubble.ai { background: #fff; align-self: flex-start; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.bubble.me { background: var(--brand); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.bubble.sys { align-self: center; background: #fff3e6; color: #b9801e; font-size: 12.5px; text-align: center; border-radius: 10px; padding: 6px 12px; }
.ai-input { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
.ai-typing { display: flex; gap: 8px; flex: 1; }
.ai-typing input { flex: 1; padding: 10px 14px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; outline: none; }
.ai-typing input:focus { border-color: var(--brand); }
.mic-main { flex: none; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 66px; height: 66px; border-radius: 50%; border: none; cursor: pointer; background: linear-gradient(135deg, var(--brand), #5b8def); color: #fff; box-shadow: 0 4px 14px rgba(91,141,239,.4); transition: transform .12s, box-shadow .2s; }
.mic-main:hover { transform: translateY(-1px); }
.mic-main:active { transform: scale(.95); }
.mic-main .mic-ico { font-size: 24px; line-height: 1; }
.mic-main .mic-txt { font-size: 10px; margin-top: 3px; opacity: .92; }
.mic-main.recording { background: linear-gradient(135deg, #ff5252, #ff7a7a); animation: micPulse 1.1s infinite; }
@keyframes micPulse { 0% { box-shadow: 0 0 0 0 rgba(255,82,82,.55); } 70% { box-shadow: 0 0 0 16px rgba(255,82,82,0); } 100% { box-shadow: 0 0 0 0 rgba(255,82,82,0); } }
.ai-hint { margin-top: 8px; font-size: 12px; color: var(--ink-soft); text-align: center; }
.ai-hint b { color: var(--brand); }

/* 录音 / 波形 */
.recorder { margin-top: 10px; background: var(--bg-soft); border-radius: 12px; padding: 12px; }
.wave-wrap { display: flex; gap: 14px; flex-wrap: wrap; }
.wave-box { flex: 1; min-width: 220px; }
.wave-box .cap { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
canvas.wave { width: 100%; height: 70px; background: #fff; border-radius: 8px; border: 1px solid var(--line); display: block; }
.rec-controls { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.rec-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--bad); display: none; }
.rec-dot.live { display: inline-block; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.rec-result { font-size: 13px; margin-top: 8px; }
.rec-result .ok { color: var(--good); font-weight: 700; }
.rec-result .miss { color: var(--bad); font-weight: 700; text-decoration: line-through; }
.accuracy-ring { font-size: 13px; font-weight: 700; }
.suggestions { background: #eaf7f0; border-left: 4px solid var(--good); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-top: 8px; }

/* 错句本 */
.err-item { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
.err-item .meta { font-size: 12px; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.err-item .wrong { color: var(--bad); text-decoration: line-through; }
.err-item .right { color: var(--good); font-weight: 700; }
.err-item .reason { font-size: 13px; margin-top: 4px; }

/* 周报 */
.report-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); }
.stat-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
.stat-card .num { font-size: 30px; font-weight: 800; color: var(--brand); }
.stat-card .lbl { font-size: 13px; color: var(--ink-soft); }
.chart-box { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); margin-top: 16px; }
.chart-box h3 { font-size: 15px; }
.bar-chart { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding-top: 10px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.bar { width: 60%; background: linear-gradient(180deg,#7aa2ff,#3b7df6); border-radius: 6px 6px 0 0; transition: height .5s; }
.bar-col .blbl { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
.bar-col .bval { font-size: 11px; font-weight: 700; }

/* 自定义表单 */
.form-grid { display: grid; gap: 12px; }
.field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; color: var(--ink-soft); }
.field input, .field textarea, .field select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 10px; font-size: 14px; outline: none; font-family: inherit;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--brand); }
.field textarea { resize: vertical; min-height: 64px; }
.hint { font-size: 12px; color: var(--ink-soft); }

/* 打印 / 导出 */
@media print {
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea { position: absolute; left: 0; top: 0; width: 100%; }
  .pcard { break-inside: avoid; border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .pkw { color: #b3563c; font-weight: 700; }
}

/* 浮动按钮 */
.fab {
  position: fixed; right: 20px; bottom: 20px; width: 46px; height: 46px;
  border-radius: 50%; border: none; background: var(--brand); color: #fff;
  font-size: 20px; cursor: pointer; box-shadow: var(--shadow); z-index: 40;
}
.fab[hidden] { display: none; }

/* 响应式 */
@media (max-width: 640px) {
  .topbar { padding: 12px; }
  .brand h1 { font-size: 18px; }
  .tagline { display: none; }
  .content { padding: 14px 12px 90px; }
  .card-grid { grid-template-columns: 1fr; }
  .topbar-right .btn { padding: 7px 10px; font-size: 12px; }
  .sentence { font-size: 17px; }
  .mainnav { display: none; }
  .mobnav { display: flex; }
  .filters { padding: 10px 12px; }
  .filter-search { min-width: 140px; order: 1; flex-basis: 100%; }
  .filter-group { order: 2; }
  .filters .btn, .filters #levelPref { order: 3; }
  .modal { max-height: 92vh; margin-bottom: 70px; }
  #wordPanel { bottom: calc(60px + env(safe-area-inset-bottom)); }
  .tts-loading { bottom: calc(78px + env(safe-area-inset-bottom)); }
}

@media (min-width: 641px) {
  .mobnav { display: none; }
}

/* 浮动语速控制（仅在播放时出现） */
.speed-float {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px;
  background: #fff; border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 6px;
  box-shadow: 0 6px 24px rgba(40,60,120,.14); z-index: 96;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.speed-float.show { opacity: 1; pointer-events: auto; }
.speed-float .speed-label { font-size: 12px; color: var(--ink-soft); font-weight: 700; padding: 0 6px; white-space: nowrap; }
.seg { display: inline-flex; background: var(--bg-soft); border-radius: 999px; padding: 3px; }
.segbtn { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 12px; color: var(--ink-soft); cursor: pointer; transition: .15s; font-family: inherit; font-weight: 700; }
.segbtn.active { background: var(--brand); color: #fff; }
.tts-loading{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b3245;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:98;box-shadow:0 6px 22px rgba(0,0,0,.2)}
#wordPanel{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(40,60,120,.12);padding:12px 14px calc(12px + env(safe-area-inset-bottom));z-index:97;max-height:46vh;overflow:auto}
.wp-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);margin-bottom:8px}.wp-head>span{flex:1}.wp-close{border:0;background:var(--bg-soft);color:var(--ink-soft);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1}
.wp-words{display:flex;flex-wrap:wrap;gap:8px}
.wp-word{border:1px solid var(--line);background:var(--bg-soft);border-radius:10px;padding:7px 11px;font-size:15px;color:var(--ink);cursor:pointer;transition:.12s;font-family:inherit;text-align:left;line-height:1.3}
.wp-word.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.wp-word.kw{border-color:var(--kw);background:var(--kw-bg);color:var(--kw);font-weight:700}
.wp-word.kw.active{background:var(--kw);color:#fff}

  function speakOnline(text, opts = {}) {

    function speakWordByWord(text, opts = {}) {
    showSpeedFloat();

    const audio = new Audio();
    let stallTimer = null;

    const clearActive = () => chips.forEach(c => c.classList.remove('active'));
    const setActive = (i) => { clearActive(); if (chips[i]) chips[i].classList.add('active'); };

    const clearStall = () => { if (stallTimer) { clearTimeout(stallTimer); stallTimer = null; } };
    const setStall = () => { clearStall(); stallTimer = setTimeout(() => { if (!paused) advance(); }, 3500); };

      clearStall();
      if (paused) return;

      if (n < words.length) setTimeout(() => playWord(n), 300);
      else if (loop) setTimeout(() => playWord(0), 900);

      audio.onended = () => { if (paused || settled) return; settled = true; clearStall(); advance(); };

      if (toggleBtn) toggleBtn.textContent = '▶ 继续';

      if (!paused) return;
      paused = false;
      if (toggleBtn) toggleBtn.textContent = '⏸ 暂停';

        a.load(); a.play().catch(() => { const b = new Audio(baiduUrl(w, 'normal')); b.preload = 'auto'; b.load(); b.play().catch(() => {}); });

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  function startRecognition(onResult, onError, opts = {}) {

    rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onresult = (e) => { onResult(e.results[0][0].transcript); };
    rec.onerror = (e) => { onError && onError(e.error || 'error'); };
    rec.onstart = () => { opts.onStart && opts.onStart(); };
    rec.onend = () => { opts.onEnd && opts.onEnd(); };
    try { rec.start(); } catch (e) { onError && onError('start'); }
    return rec;
  }

  function renderMarked(text, card) {
    const kwMap = {};
    (card.keywords || []).forEach(k => { kwMap[k.w.toLowerCase()] = k; });
    const parts = String(text).split(/(\[\[[^\]]+\]\])/g);
    return parts.map(p => {
      const m = p.match(/^\[\[([^\]]+)\]\]$/);
      if (m) {
        const w = m[1];
        const info = kwMap[w.toLowerCase()];
        const ipa = info ? info.ipa : (IPA[w.toLowerCase()] || '');
        return `<span class="kw" data-word="${escapeHtml(w)}" data-card="${escapeHtml(card.id)}">` +
          `${escapeHtml(w)}<span class="ipa">${escapeHtml(ipa)}</span>` +
          `<button class="speak-btn" data-speak="${escapeHtml(w)}" title="发音" aria-label="发音">🔊</button></span>`;
      }
      return escapeHtml(p);
    }).join('');

          <button class="btn small ghost" data-play-dialog="${escapeHtml(card.id)}">🔊 播放对话</button>
        </div>

      <div class="card-actions">${actions}</div>

  // 从持久化的 ui 状态恢复界面位置，刷新后停在原来的视图/筛选
  let currentFilter = { scene: state.ui.scene || 'all', level: state.ui.level || 'all', q: state.ui.q || '' };
  let dailyOnly = !!state.ui.dailyOnly;

  function applyFilter(list) {
    return list.filter(c => {
      if (currentFilter.scene !== 'all' && c.scene !== currentFilter.scene) return false;
      if (currentFilter.level !== 'all' && c.level !== currentFilter.level) return false;
      if (currentFilter.q) {
        const q = currentFilter.q.toLowerCase();
        const hay = (c.sentence + ' ' + (c.keywords || []).map(k => k.w).join(' ') + ' ' + sceneName(c.scene)).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  /* ---------------- 每日推荐 / 遗忘曲线 ---------------- */
  function generateDaily() {
    const t = todayStr();
    if (state.dailyShown[t] && state.dailyShown[t].length) { dailyOnly = true; viewLearn(); state.ui.dailyOnly = true; save(); return; }
    let allPool = allCards().filter(c => !state.seen[c.id]);
    const pref = state.settings.levelPref;
    let pool = pref === 'all' ? allPool : allPool.filter(c => c.level === pref);
    if (pool.length < state.settings.dailyCount) pool = allPool;
    const order = { survival: 0, daily: 1, native: 2 };
    pool.sort((a, b) => (order[a.level] || 1) - (order[b.level] || 1));
    const n = Math.min(state.settings.dailyCount, pool.length);
    const ids = pool.slice(0, n).map(c => c.id);
    ids.forEach(id => { state.seen[id] = true; addToReview(id, true); });
    state.dailyShown[t] = ids;
    save();
    dailyOnly = true;
    state.ui.dailyOnly = true; save();
    toast(`已为你生成 ${ids.length} 张今日新卡 🎉`);
    viewLearn();
  }

  function addToReview(cardId, initial) {
    if (!state.reviews[cardId]) {
      state.reviews[cardId] = { ease: 2.5, due: addDays(todayStr(), 1), reps: 0, last: '' };
    }
  }
  function reviewCard(cardId, quality) {
    const r = state.reviews[cardId] || { ease: 2.5, due: todayStr(), reps: 0 };
    r.reps = quality < 2 ? 0 : r.reps + 1;
    let interval;
    if (quality < 2) interval = 1;
    else if (r.reps === 1) interval = 1;
    else if (r.reps === 2) interval = 3;
    else interval = Math.round((state.reviews[cardId] ? (parseInt((state.reviews[cardId]._last || 1))) : 1) * r.ease) || 4;
    r.ease = Math.max(1.3, Math.min(3, r.ease + (quality >= 2 ? 0.1 : -0.2)));
    r.due = addDays(todayStr(), interval);
    r._last = interval; r.last = todayStr();
    state.reviews[cardId] = r;
    save();
    const msg = quality >= 2 ? '👍 记得，已延长复习间隔' : (quality === 1 ? '🤔 稍后多复习一次' : '😵 已安排明天重练');
    toast(msg);
    viewReview();
  }

  /* ---------------- 跟读练习 / 波形对比 ---------------- */
  let activeStream = null;
  function closeRecorder() {
    if (activeStream) { activeStream.getTracks().forEach(t => t.stop()); activeStream = null; }
    speechSynthesis.cancel();
  }
  function pseudoWave(text) {
    const arr = []; const seed = text.length ? text.charCodeAt(0) : 7;
    for (let i = 0; i < 60; i++) {
      const x = (Math.sin(i * 0.5 + seed) + Math.sin(i * 0.17 + seed * 2)) / 2;
      arr.push(Math.abs(x) * (0.4 + 0.6 * Math.abs(Math.sin(i * 0.3))));
    }
    return arr;
  }
  function drawWave(canvas, data, color) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width = canvas.clientWidth || 300;
    const h = canvas.height = 70;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = color;
    const n = data.length; const bw = w / n;
    data.forEach((v, i) => {
      const bh = Math.max(2, v * h * 0.9);
      ctx.fillRect(i * bw, (h - bh) / 2, Math.max(1, bw - 1), bh);
    });
  }
  function wordAccuracy(target, transcript) {
    const tgt = target.toLowerCase().replace(/[^a-z\s']/g, '').split(/\s+/).filter(Boolean);
    const got = transcript.toLowerCase().replace(/[^a-z\s']/g, '').split(/\s+/).filter(Boolean);
    let hit = 0; const miss = [];
    tgt.forEach((w, i) => {
      if (got[i] === w) hit++;
      else miss.push(w);
    });
    const acc = tgt.length ? Math.round(hit / tgt.length * 100) : 0;
    return { acc, miss, tgt };
  }
  function openRecorder(slot, card) {
    closeRecorder();
    const target = card.sentence.replace(/\[\[|\]\]/g, '');
    slot.innerHTML = `<div class="recorder">
      <div class="wave-wrap">
        <div class="wave-box"><div class="cap">🎯 原声参考波形</div><canvas class="wave" id="refWave"></canvas></div>
        <div class="wave-box"><div class="cap">🎙️ 我的录音波形</div><canvas class="wave" id="myWave"></canvas></div>
      </div>
      <div class="rec-controls">
        <span class="rec-dot" id="recDot"></span>
        <button class="btn small primary" id="recBtn">● 开始录音</button>
        <button class="btn small" id="playRef">▶ 听原声</button>
        <span class="accuracy-ring" id="accRing"></span>
      </div>
      <div class="rec-result" id="recResult"></div>
    </div>`;
    drawWave($('#refWave', slot), pseudoWave(target), '#9fb4d8');
    drawWave($('#myWave', slot), new Array(60).fill(0), '#ff9e80');

    const mySamples = [];
    let mediaRecorder, analyser, rafId, audioCtx, source, recData = [], recognizing = false, recog = null;

    $('#playRef', slot).onclick = () => speak(target, { rate: 0.9 });

    $('#recBtn', slot).onclick = async () => {
      if (!recognizing) {
        if (!SR) { toast('当前浏览器不支持语音识别（可用 Chrome/Edge）'); return; }
        try {
          activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) { toast('无法访问麦克风'); return; }
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        source = audioCtx.createMediaStreamSource(activeStream);
        analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
        source.connect(analyser);
        mediaRecorder = new MediaRecorder(activeStream);
        mediaRecorder.ondataavailable = e => recData.push(e.data);
        mediaRecorder.start();
        recognizing = true;
        $('#recBtn', slot).textContent = '■ 停止并分析';
        $('#recDot', slot).classList.add('live');
        const buf = new Uint8Array(analyser.frequencyBinCount);
        const tick = () => {
          analyser.getByteTimeDomainData(buf);
          let max = 0; for (let i = 0; i < buf.length; i++) { const v = Math.abs(buf[i] - 128) / 128; if (v > max) max = v; }
          mySamples.push(max);
          if (mySamples.length > 60) mySamples.shift();
          drawWave($('#myWave', slot), mySamples.slice(), '#ff9e80');
          rafId = requestAnimationFrame(tick);
        };
        tick();
        recog = startRecognition(
          (transcript) => { onDone(transcript); },
          (err) => { if (err === 'unsupported') toast('浏览器不支持语音识别'); }
        );
      } else {
        try { mediaRecorder.stop(); } catch (e) {}
        if (recog) try { recog.stop(); } catch (e) {}
        cancelAnimationFrame(rafId);
        $('#recDot', slot).classList.remove('live');
        $('#recBtn', slot).textContent = '● 开始录音';
        recognizing = false;
        if (activeStream) { activeStream.getTracks().forEach(t => t.stop()); activeStream = null; }
        setTimeout(() => { if (!$('#recResult', slot).innerHTML) toast('没检测到语音，请重试'); }, 400);
      }
    };

    function onDone(transcript) {
      const { acc, miss } = wordAccuracy(target, transcript);
      $('#accRing', slot).innerHTML = `准确率 <b style="color:${acc >= 70 ? 'var(--good)' : 'var(--bad)'}">${acc}%</b>`;
      const tgtHtml = target.split(/\s+/).map((w, i) =>
        (transcript.toLowerCase().replace(/[^a-z\s']/g, '').split(/\s+/)[i] === w.toLowerCase())
          ? `<span class="ok">${escapeHtml(w)}</span>` : `<span class="miss">${escapeHtml(w)}</span>`).join(' ');
      let sug = '';
      if (acc >= 85) sug = '🎉 非常接近原声，语调与用词都很到位！';
      else if (acc >= 60) sug = `继续打磨：注意 ${miss.slice(0, 3).join(', ')} 的发音与重音。`;
      else sug = `多听几遍原声，重点练：${miss.slice(0, 4).join(', ')}。可放慢语速、夸张口型。`;
      $('#recResult', slot).innerHTML =
        `<div><b>你说：</b>${escapeHtml(transcript)}</div>
         <div style="margin-top:4px"><b>逐词对比：</b>${tgtHtml}</div>
         <div class="suggestions">${sug}</div>`;
      recordAccuracy(acc);
      if (acc < 55) {
        addError({ scene: card.scene, source: '跟读练习', wrong: transcript, right: target, reason: `发音准确率仅 ${acc}%，重点词未读准：${miss.join(', ')}` });
        toast('已加入错句本 📕');
      }
    }
  }
  function recordAccuracy(acc) {
    const t = todayStr();
    const s = state.stats.days[t] || { learned: 0, accSum: 0, accCount: 0 };
    s.accSum += acc; s.accCount += 1;
    state.stats.days[t] = s; save();
  }

  /* ---------------- AI 陪练 ---------------- */
  let aiState = null;
  function openAI() {
    $('#aiChat').innerHTML = '';
    $('#aiInputBar').style.display = 'none';
    const scenes = SCENES.filter(s => allCards().some(c => c.scene === s.id));
    $('#aiScenePick').innerHTML = '<div class="muted" style="margin-bottom:6px">选择一个场景，AI 会用今天学到的表达带你模拟对话：</div>' +
      scenes.map(s => `<button class="chip" data-aiscene="${s.id}">${s.emoji} ${s.name}</button>`).join('');
    $('#aiModal').hidden = false;
    aiState = null;
  }
  function startAIScene(sceneId) {
    const cards = allCards().filter(c => c.scene === sceneId);
    const card = cards[Math.floor(Math.random() * cards.length)];
    aiState = { sceneId, card, turn: 0, turns: 0, kwHits: 0, errs: 0 };
    $('#aiScenePick').innerHTML = `<div class="muted">场景：<b>${sceneName(sceneId)}</b> · 目标表达：<i>${escapeHtml(card.sentence.replace(/\[\[|\]\]/g, ''))}</i></div>`;
    $('#aiInputBar').style.display = 'flex';
    $('#aiChat').innerHTML = '';
    aiSay(`Hi! Let's practice ${sceneName(sceneId)}. Imagine we're in this situation:`, 'sys');
    setTimeout(() => aiSay(card.dialogue[0].text.replace(/\[\[|\]\]/g, ''), 'ai'), 600);
    setTimeout(() => {
      aiSay(`Now you try! Can you say: “${card.sentence.replace(/\[\[|\]\]/g, '')}”`, 'ai');
      const h = $('#aiHint'); if (h) h.hidden = false;
    }, 1400);
  }
  function aiSay(text, who) {
    const cls = who === 'me' ? 'me' : (who === 'sys' ? 'sys' : 'ai');
    const b = document.createElement('div');
    b.className = 'bubble ' + cls;
    b.textContent = text;
    $('#aiChat').appendChild(b);
    $('#aiChat').scrollTop = $('#aiChat').scrollHeight;
    if (who === 'ai') speak(text, { rate: 0.95 });
  }
  function aiUser(text) {
    aiSay(text, 'me');
    aiState.turns += 1;
    const { card, turn } = aiState;
    const kws = (card.keywords || []).map(k => k.w.toLowerCase());
    const used = kws.some(k => text.toLowerCase().includes(k));
    if (used) aiState.kwHits += 1;
    let fb = '';
    if (turn === 0) {
      if (used) { fb = `Great! You used “${kws.find(k => text.toLowerCase().includes(k))}” perfectly. `; }
      else { fb = `Nice try! A more natural way: “${card.sentence.replace(/\[\[|\]\]/g, '')}”. `; aiState.errs += 1; addError({ scene: card.scene, source: 'AI陪练', wrong: text, right: card.sentence.replace(/\[\[|\]\]/g, ''), reason: '未使用目标重点词/句型' }); }
      aiState.turn = 1;
      setTimeout(() => aiSay(card.dialogue[1].text.replace(/\[\[|\]\]/g, ''), 'ai'), 700);
      setTimeout(() => aiSay(`Now ask me something back, or tell me your opinion!`, 'ai'), 1600);
    } else {
      fb = used ? `Good, you're getting the hang of it! ` : `Keep practicing the key word “${kws[0] || ''}”. `;
      aiState.turn = 2;
      setTimeout(() => endAISession(fb), 800);
    }
  }
  function endAISession(extra) {
    const { card, turns, kwHits, errs } = aiState;
    const tN = Math.max(turns, 1);
    const usage = kwHits / tN;
    let score = Math.round(usage * 70 + Math.min(turns, 3) / 3 * 30 - errs * 12);
    score = Math.max(0, Math.min(100, score));
    const advice = score >= 80 ? '沟通很顺，继续保持！' : score >= 55 ? '基本能交流，重点词再多练熟些。' : '还不太顺，多跟读目标句、把重点词用对。';
    const kws = (card.keywords || []).map(k => k.w).join(', ');
    aiSay(`📋 反馈小结：${extra || ''}本次目标表达「${card.sentence.replace(/\[\[|\]\]/g, '')}」重点词：${kws}。多用、多听原声，口语会越来越顺！`, 'sys');
    aiSay(`🎯 本次沟通顺畅度：${score} 分 — ${advice}`, 'sys');
    $('#aiInputBar').style.display = 'none';
    const h = $('#aiHint'); if (h) h.hidden = true;
  }

  /* ---------------- 自定义卡片 ---------------- */
  function viewCustom() {
    const c = $('#content');
    c.innerHTML = `<h2 class="section-title">➕ 自定义卡片</h2>
      <div class="muted" style="margin-bottom:12px">录入短句与对话，用 <code>[[单词]]</code> 标记重点词，系统自动匹配音标与发音。</div>
      <div class="form-grid" style="max-width:640px">
        <div class="field"><label>场景</label><select id="cfScene">${SCENES.map(s => `<option value="${s.id}">${s.emoji} ${s.name}</option>`).join('')}</select></div>
        <div class="field"><label>难度</label><select id="cfLevel">${LEVELS.map(l => `<option value="${l.id}">${l.name}</option>`).join('')}</select></div>
        <div class="field"><label>实用短句（用 [[ ]] 标记重点词）</label><textarea id="cfSentence" placeholder="如：Could you [[recommend]] something local?"></textarea></div>
        <div class="field"><label>对话 A</label><textarea id="cfA" placeholder="A: Could you recommend something local?"></textarea></div>
        <div class="field"><label>对话 B</label><textarea id="cfB" placeholder="B: Sure, the beef noodles are great!"></textarea></div>
        <div class="field"><label>文化小贴士（可选）</label><textarea id="cfCulture" placeholder="如：这句话在正式场合不适合用"></textarea></div>
        <div class="field"><label>重点词（逗号分隔，自动匹配音标）</label><input id="cfWords" placeholder="recommend, local" /></div>
        <button class="btn primary block" id="cfSave">💾 保存卡片</button>
      </div>
      <div id="cfList" style="margin-top:20px"></div>`;
    renderCustomList();
    $('#cfSave').onclick = saveCustom;
  }
  function renderCustomList() {
    const box = $('#cfList'); if (!box) return;
    if (!state.custom.length) { box.innerHTML = '<div class="muted">还没有自定义卡片。</div>'; return; }
    box.innerHTML = '<h3 style="font-size:15px">已创建的卡片</h3>' + state.custom.map(c =>
      `<div class="err-item"><div class="meta"><span>${escapeHtml(sceneName(c.scene))} · ${levelInfo(c.level).name}</span>
        <button class="btn small ghost" data-delfav="${c.id}">🗑 删除</button></div>
      <div class="sentence" style="font-size:16px">${renderMarked(c.sentence, c)}</div></div>`).join('');
  }
  function saveCustom() {
    const sentence = $('#cfSentence').value.trim();
    if (!sentence) { toast('请填写实用短句'); return; }
    const wordsRaw = $('#cfWords').value;
    const wordList = wordsRaw.split(/[,，]/).map(w => w.trim()).filter(Boolean);
    const keywords = wordList.map(w => {
      const ipa = IPA[w.toLowerCase()] || '';
      return { w, ipa, pos: ipa ? '—' : '（待补充）', root: '—', affix: '—', enDef: '—', cnDef: '（系统自动匹配音标）', ex: [] };
    });
    const card = {
      id: 'c_' + Date.now(),
      scene: $('#cfScene').value, level: $('#cfLevel').value,
      sentence,
      dialogue: [
        { sp: 'A', text: $('#cfA').value.trim() || sentence },
        { sp: 'B', text: $('#cfB').value.trim() || '...' },
      ],
      cultureTip: $('#cfCulture').value.trim() || '',
      keywords,
      custom: true,
    };
    state.custom.push(card); save();
    toast('✅ 自定义卡片已保存');
    $('#cfSentence').value = $('#cfA').value = $('#cfB').value = $('#cfCulture').value = $('#cfWords').value = '';
    renderCustomList();
  }

  /* ---------------- 导出 / 打印收藏 ---------------- */
  function exportFav() {
    const list = allCards().filter(c => state.favorites[c.id]);
    if (!list.length) { toast('还没有收藏'); return; }
    let html = `<div id="printArea"><h1 style="text-align:center">SpeakDeck · 我的收藏清单</h1>
      <p style="text-align:center;color:#888">导出日期：${todayStr()}</p>`;
    list.forEach(c => {
      html += `<div class="pcard">
        <div><b>${escapeHtml(c.sentence.replace(/\[\[|\]\]/g, ''))}</b> <span style="color:#999">[${escapeHtml(sceneName(c.scene))}·${levelInfo(c.level).name}]</span></div>
        <div style="margin:4px 0">${c.dialogue.map(d => `<div>${d.sp}: ${escapeHtml(d.text.replace(/\[\[|\]\]/g, ''))}</div>`).join('')}</div>`;
      if (c.cultureTip) html += `<div style="color:#b9801e;font-size:13px">💡 ${escapeHtml(c.cultureTip)}</div>`;
      const kws = (c.keywords || []).map(k => `<span class="pkw">${escapeHtml(k.w)}</span> ${escapeHtml(k.ipa)} ${escapeHtml(k.cnDef)}`).join(' ｜ ');
      if (kws) html += `<div style="margin-top:4px;font-size:13px">${kws}</div>`;
      html += `</div>`;
    });
    html += `</div>`;
    const w = window.open('', '_blank');
    w.document.write(`<html><head><meta charset="utf-8"><title>SpeakDeck 收藏</title>
      <style>body{font-family:"PingFang SC",sans-serif;padding:24px;color:#222}
      .pcard{border:1px solid #ccc;border-radius:8px;padding:10px;margin-bottom:10px}
      .pkw{color:#b3563c;font-weight:700}</style></head><body>${html}
      <scr`+`ipt>window.onload=function(){setTimeout(function(){window.print()},300)}<\/scr`+`ipt></body></html>`);
    w.document.close();
  }

  /* ---------------- 打卡 ---------------- */
  function markLearned(cardId) {
    const t = todayStr();
    const s = state.stats.days[t] || { learned: 0, accSum: 0, accCount: 0 };
    s.learned += 1; state.stats.days[t] = s;
    addToReview(cardId, false);
    save();
    toast('已记录学习 ✅');
    if (dailyOnly) viewLearn();
  }
  function updateStreak() {
    const t = todayStr();
    if (state.stats.lastActive === t) return;
    if (state.stats.lastActive === addDays(t, -1)) state.stats.streak += 1;
    else state.stats.streak = 1;
    state.stats.lastActive = t;
    save();
  }

  /* ---------------- 筛选条渲染 ---------------- */
  function renderFilters() {
    $('#sceneFilter').innerHTML = `<button class="chip ${currentFilter.scene === 'all' ? 'active' : ''}" data-scene="all">🌐 全部</button>` +
      SCENES.map(s => `<button class="chip ${currentFilter.scene === s.id ? 'active' : ''}" data-scene="${s.id}">${s.emoji} ${s.name}</button>`).join('');
    $('#levelFilter').innerHTML = `<button class="chip ${currentFilter.level === 'all' ? 'active' : ''}" data-level="all">全部难度</button>` +
      LEVELS.map(l => `<button class="chip ${currentFilter.level === l.id ? 'active' : ''}" data-level="${l.id}"><span class="dot" style="background:${l.color}"></span>${l.name}</button>`).join('');
  }

  /* ---------------- 导航 / 事件 ---------------- */
  function switchView(v) {
    stopWordPlayback();
    // 只有离开 learn 视图时才清空每日推荐标记，避免刷新后“今日推荐”被强制切回全部卡片
    if (v !== 'learn') dailyOnly = false;
    currentView = v;
    $$('.navitem').forEach(b => b.classList.toggle('active', b.dataset.view === v));
    $$('.mobitem').forEach(b => b.classList.toggle('active', b.dataset.view === v));
    $('#filterBar').style.display = (v === 'learn') ? 'flex' : 'none';
    if (v === 'learn') viewLearn();
    else if (v === 'review') viewReview();
    else if (v === 'fav') viewFav();
    else if (v === 'errors') viewErrors();
    else if (v === 'report') viewReport();
    else if (v === 'custom') viewCustom();
    // 记住当前视图与每日推荐状态，刷新后恢复
    state.ui.view = v; state.ui.dailyOnly = dailyOnly; save();
    window.scrollTo({ top: 0 });
  }

  function bindEvents() {
    $('#mainnav').addEventListener('click', e => {
      const b = e.target.closest('.navitem'); if (b) switchView(b.dataset.view);
    });
    $('#mobnav').addEventListener('click', e => {
      const b = e.target.closest('.mobitem'); if (b) switchView(b.dataset.view);
    });
    const speedSeg = $('#speedSeg');
    if (speedSeg) {
      speedSeg.addEventListener('click', e => {
        const b = e.target.closest('.segbtn'); if (!b) return;
        state.settings.speakSpeed = b.dataset.speed;
        save();
        speedSeg.querySelectorAll('.segbtn').forEach(x => x.classList.toggle('active', x === b));
        const label = { normal: '正常语速', slow: '慢速模式', word: '逐词跟读' }[b.dataset.speed];
        toast('🔊 已切换为' + label);
      });
    }
    $('#grammarBtn').onclick = openGrammar;
    $('#aiBtn').onclick = openAI;
    $('#dailyBtn').onclick = () => { switchView('learn'); generateDaily(); };
    const ft = $('#filterToggle');
    if (ft) ft.onclick = () => $('#filterCollapse').classList.toggle('open');

    $('#sceneFilter').addEventListener('click', e => {
      const b = e.target.closest('[data-scene]'); if (!b) return;
      currentFilter.scene = b.dataset.scene; dailyOnly = false; renderFilters(); viewLearn();
      state.ui.scene = currentFilter.scene; state.ui.dailyOnly = false; save();
    });
    $('#levelFilter').addEventListener('click', e => {
      const b = e.target.closest('[data-level]'); if (!b) return;
      currentFilter.level = b.dataset.level; dailyOnly = false; renderFilters(); viewLearn();
      state.ui.level = currentFilter.level; state.ui.dailyOnly = false; save();
    });
    $('#searchInput').addEventListener('input', e => {
      currentFilter.q = e.target.value.trim(); dailyOnly = false; viewLearn();
      state.ui.q = currentFilter.q; state.ui.dailyOnly = false; save();
    });

    $('#content').addEventListener('click', e => {
      const star = e.target.closest('[data-star]');
      if (star) {
        const id = star.dataset.star;
        if (state.favorites[id]) { delete state.favorites[id]; }
        else { state.favorites[id] = true; addToReview(id, true); }
        save(); star.classList.toggle('on'); star.textContent = state.favorites[id] ? '★' : '☆';
        toast(state.favorites[id] ? '已收藏 ⭐' : '已取消收藏');
        return;
      }
      const speakBtn = e.target.closest('[data-speak]');
      if (speakBtn) { e.stopPropagation(); speak(speakBtn.dataset.speak, { el: speakBtn }); return; }
      const kw = e.target.closest('.kw');
      if (kw) { openWord(kw.dataset.word, kw.dataset.card); return; }
      const play = e.target.closest('[data-play]');
      if (play) {
        const c = getCard(play.dataset.play);
        const kwMap = {}; (c.keywords || []).forEach(k => { kwMap[k.w.toLowerCase()] = k; });
        speak(c.sentence.replace(/\[\[|\]\]/g, ''), { el: play, kwMap });
        return;
      }
      const playD = e.target.closest('[data-play-dialog]');
      if (playD) {
        const c = getCard(playD.dataset.playDialog);
        const kwMap = {}; (c.keywords || []).forEach(k => { kwMap[k.w.toLowerCase()] = k; });
        speakSequence(c.dialogue.map(d => d.text.replace(/\[\[|\]\]/g, '')), { rate: 0.92, kwMap });
        return;
      }
      const prac = e.target.closest('[data-practice]');
      if (prac) {
        const slot = $(`[data-slot="${prac.dataset.practice}"]`);
        if (slot.dataset.open === '1') { slot.innerHTML = ''; slot.dataset.open = '0'; closeRecorder(); }
        else { slot.innerHTML = ''; slot.dataset.open = '1'; openRecorder(slot, getCard(prac.dataset.practice)); }
        return;
      }
      const learned = e.target.closest('[data-learned]');
      if (learned) { markLearned(learned.dataset.learned); return; }
      const recall = e.target.closest('[data-recall]');
      if (recall) { reviewCard(recall.dataset.recall, parseInt(recall.dataset.q)); return; }
      const brush = e.target.closest('[data-brush]');
      if (brush) { brushUp(brush.dataset.brush); return; }
      const rmode = e.target.closest('[data-rmode]');
      if (rmode) { reviewMode = rmode.dataset.rmode; viewReview(); state.ui.reviewMode = reviewMode; save(); return; }
      const rscene = e.target.closest('[data-rscene]');
      if (rscene) { reviewScene = rscene.dataset.rscene; viewReview(); state.ui.reviewScene = reviewScene; save(); return; }
      const go = e.target.closest('[data-go]');
      if (go) { switchView(go.dataset.go); return; }
      const solve = e.target.closest('[data-solve]');
      if (solve) {
        const er = state.errors.find(x => x.id === solve.dataset.solve);
        if (er) { er.solved = !er.solved; save(); viewErrors(); }
        return;
      }
      const delfav = e.target.closest('[data-delfav]');
      if (delfav) {
        state.custom = state.custom.filter(x => x.id !== delfav.dataset.delfav);
        delete state.favorites[delfav.dataset.delfav];
        save(); renderCustomList();
        return;
      }
    });

    $$('.modal-overlay').forEach(ov => {
      ov.addEventListener('click', e => {
        if (e.target === ov || e.target.hasAttribute('data-close')) {
          ov.hidden = true; if (ov.id === 'wordModal' || ov.id === 'aiModal') closeRecorder();
        }
      });
    });
    $('#grammarTabs').addEventListener('click', e => {
      const b = e.target.closest('[data-gtab]'); if (!b) return;
      $$('#grammarTabs .chip').forEach(x => x.classList.toggle('active', x === b));
      $('#grammarBody').innerHTML = GRAMMAR[b.dataset.gtab].html;
    });

    $('#aiScenePick').addEventListener('click', e => {
      const b = e.target.closest('[data-aiscene]'); if (b) startAIScene(b.dataset.aiscene);
    });
    $('#aiSend').onclick = () => {
      const v = $('#aiInput').value.trim(); if (!v || !aiState) return;
      $('#aiInput').value = ''; aiUser(v);
    };
    $('#aiInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#aiSend').click(); });
    $('#aiMic').onclick = () => {
      const mic = $('#aiMic'), micTxt = $('#aiMicTxt');
      if (!SR) { toast('当前浏览器不支持语音识别'); return; }
      if (!aiState) { toast('请先选择一个场景'); return; }
      if (mic.classList.contains('recording')) return;
      $('#aiInput').value = '';
      startRecognition(
        (t) => {
          mic.classList.remove('recording'); micTxt.textContent = '点击说';
          if (aiState && t && t.trim()) aiUser(t.trim());
        },
        (err) => {
          mic.classList.remove('recording'); micTxt.textContent = '点击说';
          if (err === 'unsupported') toast('浏览器不支持语音识别');
          else if (err === 'no-speech') toast('没听清，请再说一次');
          else if (err !== 'aborted') toast('语音识别出错，请重试');
        },
        {
          onStart: () => { mic.classList.add('recording'); micTxt.textContent = '聆听中…'; },
          onEnd: () => { mic.classList.remove('recording'); micTxt.textContent = '点击说'; }
        }
      );
    };

    $('#levelPref').value = state.settings.levelPref;
    $('#levelPref').addEventListener('change', e => {
      state.settings.levelPref = e.target.value; save();
      toast('已保存推荐偏好：' + e.target.options[e.target.selectedIndex].text);
    });

    const fab = $('#scrollTop');
    window.addEventListener('scroll', () => { fab.hidden = window.scrollY < 400; });
    fab.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ---------------- 初始化 ---------------- */
  function init() {
    const banner = $('#audioBanner');
    const bannerText = $('#audioBannerText');
    if (banner && bannerText) {
      if (!('speechSynthesis' in window)) {
        banner.hidden = false;
        banner.className = 'audio-banner';
        bannerText.textContent = '🌐 当前浏览器未开放本地语音，已自动启用在线发音（需联网）。如需离线使用，建议用 Chrome 或 Edge 浏览器。';
      } else if (window.location.protocol === 'file:') {
        banner.hidden = false;
        banner.className = 'audio-banner';
        bannerText.textContent = '💡 检测到本地文件打开模式。建议用 Live Server 或本地服务器打开以获得最佳语音体验。发音仍可尝试使用。';
      } else {
        banner.hidden = true;
      }
      const bc = $('#audioBannerClose');
      if (bc) bc.onclick = () => { banner.hidden = true; };
    }

    updateStreak();
    try {
      const sp = state.settings.speakSpeed || 'normal';
      const seg = $('#speedSeg');
      if (seg) seg.querySelectorAll('.segbtn').forEach(x => x.classList.toggle('active', x.dataset.speed === sp));
    } catch (e) {}
    renderFilters();
    // 搜索框 value 与 currentFilter.q 保持一致，避免“列表已过滤但输入框为空”
    const searchInput = $('#searchInput');
    if (searchInput) searchInput.value = currentFilter.q || '';
    bindEvents();
    switchView(state.ui.view || 'learn');
    $('#streakDays').textContent = state.stats.streak;
    if (!state.dailyShown[todayStr()] || !state.dailyShown[todayStr()].length) {
      setTimeout(generateDaily, 300);
    }
    if (window.speechSynthesis) {
      const warmup = () => {
        try {
          if (speechSynthesis.paused) speechSynthesis.resume();
          const u = new SpeechSynthesisUtterance('Hi');
          u.volume = 0; u.rate = 2;
          speechSynthesis.speak(u);
        } catch (e) {}
      };
      const once = () => { warmup(); document.removeEventListener('click', once); };
      document.addEventListener('click', once, { once: true });
    }
  }
  document.addEventListener('DOMContentLoaded', init);
